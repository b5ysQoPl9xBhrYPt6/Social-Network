{% extends "base.html" %}
{% load static %}

{% block content %}
    <header id="headerBox">
        <img id = 'headerPhoto' src="{% static 'user_app/img/header.png' %}" alt="Photo not loaded">
    </header>

    <div id = "mainBlock">
        <div id="authBox">
            <div id = 'regLogDiv'>
                <h1 id="regTitle">Реєстрація</h1>
                <h1 id="logTitle">Авторизація</h1>
            </div>
            <h3 id = 'welcomeText'>Приєднуйся до World IT</h3>
            {% include "user_app/forms/regform.html" %}
            {% include "user_app/forms/logform.html" %}
        </div>
        <img src="{% static 'user_app/img/background.png' %}" alt="Computer" id = 'background'>
    </div>
{% endblock %}

{% block links %}
    <link rel="stylesheet" href="{% static 'user_app/css/authentification.css' %}">
{% endblock %}

{% block scripts %}
    <script src="{% static 'user_app/js/authentification.js' %}"></script>
{% endblock %}
