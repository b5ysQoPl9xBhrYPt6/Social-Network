<!-- СОДЕРЖИМОЕ ФОРМ ВРЕМЕННОЕ -->
<form method="post" id="logForm" hidden>
    {% csrf_token %}
    
    <input type="email" placeholder="you@example.com" name = "mailInput" required>
    <input type="password" placeholder="Введи пароль" name = "passwordInput" required>
    
    <button name = "logButton" class="continue-button"><p class="continue-text">Увійти</p></button>
</form>
