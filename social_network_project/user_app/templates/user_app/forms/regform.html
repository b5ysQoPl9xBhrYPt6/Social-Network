<!-- СОДЕРЖИМОЕ ФОРМ ВРЕМЕННОЕ -->
<form method="post" id="regForm">
    {% csrf_token %}
    
    
    <input type="email" placeholder="you@example.com" name = "mailInput"required>
    <input type="password" placeholder="Введи пароль" name = "passwordInput" required>
    <input type="password" placeholder="Повтори пароль"  name = "confirmPasswordInput"required>
    
    <button name = "regButton" class="continue-button"><p class="continue-text">Створити акаунт</p></button>
</form>
